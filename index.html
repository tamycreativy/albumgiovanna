.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,13,28,.15),rgba(7,13,28,.2) 45%,var(--navy) 98%)}
.hero .t{position:absolute;left:0;right:0;bottom:22px;z-index:2;text-align:center;padding:0 18px}
.hero small{display:block;letter-spacing:.34em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.hero h1{font:700 32px/1.1 'Cinzel Decorative',serif;margin:8px 0 4px;background:linear-gradient(180deg,#fff,#aebcd6 60%,#e8d3a2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;font-style:italic;font-size:19px;color:var(--silver2)}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:10px 14px;background:rgba(7,13,28,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(213,222,238,.14)}
.tab{all:unset;flex:1;text-align:center;padding:11px 8px;border-radius:999px;font:600 13px 'Cinzel Decorative',serif;letter-spacing:.06em;color:var(--silver2);border:1px solid rgba(213,222,238,.25);cursor:pointer}
.tab[aria-selected=true]{color:#0b1427;background:linear-gradient(135deg,#f4f7fd,#b4c3dd 55%,#e8d3a2);border-color:transparent;box-shadow:0 6px 18px -6px rgba(180,195,221,.6)}
.pane{display:none;padding:18px 14px 120px}.pane.on{display:block}
.vazio{text-align:center;font-style:italic;color:var(--silver2);font-size:19px;margin:40px 10px}
.dica{text-align:center;font-style:italic;color:var(--silver2);margin:2px 10px 6px;font-size:18px}
.grade{display:flex;gap:14px;align-items:flex-start;padding-top:8px}.col{flex:1;min-width:0;display:flex;flex-direction:column}
.post{all:unset;display:block;cursor:pointer;margin:0 0 16px;border-radius:14px;padding:6px;position:relative;
 background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 45%,rgba(180,195,221,.18));
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 box-shadow:0 0 0 1.5px #c9d4e8,0 0 0 3px rgba(7,13,28,.9),0 0 0 4px rgba(232,211,162,.55),0 16px 26px -12px #000}
.post:before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#9bc0ff,var(--sap));border:1px solid #dfe8f8;box-shadow:0 0 8px #6a95e0;z-index:2}
.post img,.post video{display:block;width:100%;border-radius:9px;background:#000}
.post .play{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:26px;color:#fff;text-shadow:0 2px 10px #000}
.post .c{display:block;padding:7px 4px 3px;font-size:15px;line-height:1.2}.post .c b{font-weight:600;color:#fff}.post .c i{color:var(--silver2)}
.post .l{float:right;color:var(--gold);font-size:14px}
.post.on{box-shadow:0 0 0 2px var(--gold),0 0 0 4px rgba(7,13,28,.9),0 0 18px var(--sap)}

.rec q{display:block;quotes:none;font-style:italic;font-size:17px;line-height:1.25;color:#fff;text-align:center;overflow-wrap:anywhere;white-space:pre-line}
.rec .mf{display:block;width:100%;border-radius:8px;margin:0 0 10px;box-shadow:0 0 0 1px rgba(201,212,232,.7)}
.rec footer{margin-top:10px;text-align:center;border-top:1px solid rgba(213,222,238,.2);padding-top:8px}
.rec footer b{display:block;font:700 11px 'Cinzel Decorative';letter-spacing:.14em;color:var(--gold);text-transform:uppercase;overflow-wrap:anywhere}
.rec footer span{font-size:13px;color:var(--silver2);font-style:italic}
.rec .del{all:unset;cursor:pointer;display:block;margin:8px auto 0;font-size:13px;color:#e59a9a;text-decoration:underline}
/* barra da aniversariante */
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:0 0 12px}
.b{all:unset;cursor:pointer;padding:9px 14px;border-radius:999px;font:600 11px 'Cinzel Decorative';letter-spacing:.06em;color:var(--silver);border:1px solid rgba(213,222,238,.35)}
.b.p{color:#0b1427;background:linear-gradient(135deg,#f4f7fd,#b4c3dd 55%,#e8d3a2);border-color:transparent}
.b[disabled]{opacity:.4}
.bm{text-align:center;font-style:italic;color:var(--silver2);margin:0 0 10px;font-size:15px}
.modo{all:unset;cursor:pointer;display:block;text-align:center;margin:26px auto 0;font-size:14px;color:#5f7090;text-decoration:underline}
/* folhas (postar / escrever / ver foto) */
.veu{position:fixed;inset:0;z-index:60;background:rgba(3,7,16,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.veu[hidden]{display:none}
.folha{width:100%;max-width:520px;max-height:94vh;overflow:auto;padding:22px 18px 28px;border-radius:22px 22px 0 0;background:linear-gradient(160deg,#16264a,#0a1226 60%);box-shadow:0 0 0 1.5px #c9d4e8,0 -10px 40px rgba(0,0,0,.6)}
.folha h2{margin:0 0 4px;text-align:center;font:700 18px 'Cinzel Decorative';letter-spacing:.06em;color:var(--gold)}
.folha .sub{text-align:center;margin:0 0 14px;font-style:italic;color:var(--silver2);font-size:16px}
.folha label{display:block;margin:12px 0 5px;font:600 11px 'Cinzel Decorative';letter-spacing:.1em;color:var(--silver2)}
.folha input[type=text],.folha textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid rgba(213,222,238,.35);background:rgba(255,255,255,.07);color:#fff;font:19px 'Cormorant Garamond',serif;outline:0}
.folha textarea{min-height:110px;resize:vertical}
.folha input:focus,.folha textarea:focus{border-color:var(--gold)}
.esc{display:flex;gap:10px}.esc .b{flex:1;text-align:center;padding:13px 6px}
.pv{display:block;max-width:100%;max-height:300px;margin:12px auto 0;border-radius:12px;box-shadow:0 0 0 1.5px #c9d4e8}
.ac{display:flex;gap:10px;margin-top:18px}.ac .b{flex:1;text-align:center;padding:14px 6px;font-size:12px}
.erro{color:#ff9d9d;text-align:center;min-height:20px;margin:10px 0 0;font-size:16px}
.det{padding:14px;overflow:auto;align-items:center}
.cx{width:100%;max-width:520px;margin:auto}
.cx .mid{display:block;width:100%;max-height:68vh;object-fit:contain;border-radius:12px;box-shadow:0 0 0 1.5px #c9d4e8;background:#000}
.cx .nome{margin:12px 0 0;text-align:center;font:700 13px 'Cinzel Decorative';letter-spacing:.12em;color:var(--gold)}
.cx .legenda{margin:4px 0 0;text-align:center;font-style:italic;font-size:19px;color:#fff}

.aviso{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:90;background:#0d1a33;color:var(--gold);border:1px solid var(--gold);padding:10px 18px;border-radius:999px;font-size:16px}

<label for="rn">SEU NOME</label><input type="text" id="rn" maxlength="40" autocomplete="name">
<label for="rt">SEU RECADO</label><textarea id="rt" maxlength="300"></textarea>

</form></div>

<div class="veu det" id="det" hidden></div>

<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var SB_URL='https://bfncxrmxlkdxqqrjmizq.supabase.co',SB_KEY='sb_publishable_1Tl_N6-UxutKxK9gOrcQVA_J4FrT7MJ';
var QS=new URLSearchParams(location.search),DEMO=QS.has('demo'),SENHA=QS.get('aniversariante')||'';
function H(x){var h={apikey:SB_KEY};for(var k in x)h[k]=x[k];return h}
function api(path,opt){opt=opt||{};opt.headers=H(opt.headers);return fetch(SB_URL+path,opt).then(function(r){
  if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,160))});
  return r.status===204?null:r.json().catch(function(){return null})})}
var JSONH={'Content-Type':'application/json'};
var posts=[],recados=[],carregando=!DEMO,falhou=false,anf=!!SENHA&&!DEMO,euCurti={},selMode=false,sel={},nid=1,aba='f';
try{euCurti=JSON.parse(localStorage.getItem('baile_curti')||'{}')||{}}catch(e){}
function guardaCurti(){try{localStorage.setItem('baile_curti',JSON.stringify(euCurti))}catch(e){}}
function aviso(t){var d=document.createElement('div');d.className='aviso';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2800)}
function atras(iso){var s=(Date.now()-new Date(iso).getTime())/1000;if(isNaN(s)||s<60)return 'agora';var m=Math.floor(s/60);if(m<60)return 'há '+m+' min';var h=Math.floor(m/60);if(h<24)return 'há '+h+' h';var d=Math.floor(h/24);return d===1?'ontem':'há '+d+' dias'}
function daPost(r){return {id:r.id,nome:r.nome,leg:r.legenda||'',likes:r.curtidas||0,video:r.tipo==='video',url:r.url}}
function daRec(r){return {id:r.id,nome:r.nome,texto:r.texto,foto:r.foto_url,quando:r.criado_em}}
/* ---------- fotos ---------- */
function dist(n){var c=[[],[]],h=[0,0];return c}
function thumb(p){
  var on=anf&&selMode&&sel[p.id];
  var m=p.video?'<video src="'+esc(p.url)+'#t=0.1" muted playsinline preload="metadata"></video><span class="play">▶</span>':'<img src="'+esc(p.url)+'" alt="Foto de '+esc(p.nome)+'" loading="lazy">';
  return '<button class="post'+(on?' on':'')+'" data-id="'+esc(p.id)+'">'+m+(anf&&selMode?'<span class="ck">'+(on?'✓':'')+'</span>':'')+'<span class="c"><span class="l">♥ '+p.likes+'</span><b>'+esc(p.nome)+'</b>'+(p.leg?' <i>'+esc(p.leg)+'</i>':'')+'</span></button>'}
function barra(){
  if(!anf)return '';var n=Object.keys(sel).length;
  if(!selMode)return '<div class="barra"><button class="b" id="bsel">Selecionar fotos</button></div>';
  return '<div class="barra"><span class="bm" style="margin:0">'+(n?n+' selecionada'+(n>1?'s':''):'toque nas fotos')+'</span><button class="b" id="btod">'+(n===posts.length?'limpar':'todas')+'</button><button class="b p" id="bbx"'+(n?'':' disabled')+'>Baixar</button><button class="b" id="bfim">Sair</button></div><p class="bm" id="bmsg"></p>'}
function desenhaFotos(){
  var h=barra();
  if(!posts.length)h+='<p class="vazio">'+(carregando?'Carregando o álbum…':falhou?'Não consegui carregar o álbum agora. Confira a internet e abra de novo.':'Ainda não tem fotos. Seja a primeira pessoa a postar.')+'</p>';
  else{var a=[],b=[];posts.forEach(function(p,i){(i%2?b:a).push(thumb(p))});h+='<div class="grade"><div class="col">'+a.join('')+'</div><div class="col">'+b.join('')+'</div></div>'}
  $('feed').innerHTML=h}
function recCard(r){
  return '<article class="rec"><i class="orn"></i>'+(r.foto?'<img class="mf" loading="lazy" alt="" src="'+esc(r.foto)+'">':'')+'<q>'+esc(r.texto)+'</q><footer><b>'+esc(r.nome)+'</b><span>'+atras(r.quando)+'</span></footer>'+(anf?'<button class="del" data-rid="'+esc(r.id)+'">apagar</button>':'')+'</article>'}
function desenhaMural(){
  if(!recados.length){$('mural').innerHTML='<p class="vazio">'+(carregando?'Carregando os recados…':falhou?'Não consegui carregar os recados agora.':'Ainda não tem recados. Escreva o primeiro!')+'</p>';return}
  var a=[],b=[];recados.forEach(function(r,i){(i%2?b:a).push(recCard(r))});
  $('mural').innerHTML='<div class="mural"><div class="mc">'+a.join('')+'</div><div class="mc">'+b.join('')+'</div></div>'}
function desenha(){desenhaFotos();desenhaMural();$('modo').textContent=anf?'voltar a ver como convidado':'ver como aniversariante';$('modo').hidden=!(SENHA&&!DEMO)}
/* abas */
function troca(t){aba=t;document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x.dataset.t===t)});document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id===t)});$('fab').style.display=t==='f'?'':'none';$('fab2').style.display=t==='r'?'flex':'none';window.scrollTo({top:document.querySelector('.hero').offsetHeight-6,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){troca(b.dataset.t)})});
$('modo').onclick=function(){anf=!anf;if(!anf){selMode=false;sel={}}desenha()};
/* ---------- ver foto ---------- */
var atual=-1;
function abreFoto(id){
  atual=posts.map(function(p){return String(p.id)}).indexOf(String(id));if(atual<0)return;
  var p=posts[atual],c=!!euCurti[p.id];
  var m=p.video?'<video class="mid" src="'+esc(p.url)+'" controls playsinline></video>':'<img class="mid" src="'+esc(p.url)+'" alt="">';
  $('det').innerHTML='<div class="cx"><div class="topd"><button class="b" id="dx">Fechar</button></div>'+m+'<p class="nome">'+esc(p.nome)+'</p>'+(p.leg?'<p class="legenda">'+esc(p.leg)+'</p>':'')+
   '<div class="acoes"><button class="b" id="dcur">'+(c?'♥':'♡')+' '+p.likes+' amei</button>'+(anf?'<button class="b" id="dap" style="color:#e59a9a">apagar</button>':'')+'</div>'+
   '<div class="nav"><button class="b" id="dpv"'+(atual===0?' disabled':'')+'>‹ Anterior</button><button class="b" id="dnx"'+(atual===posts.length-1?' disabled':'')+'>Próxima ›</button></div></div>';
  $('det').hidden=false}
function fechaFoto(){$('det').hidden=true;$('det').innerHTML=''}
$('det').addEventListener('click',function(e){
  if(e.target===$('det')||e.target.id==='dx'){fechaFoto();return}
  var p=posts[atual];if(!p)return;
  if(e.target.closest('#dcur')){var ja=!!euCurti[p.id];if(ja)delete euCurti[p.id];else euCurti[p.id]=1;guardaCurti();p.likes=Math.max(0,p.likes+(ja?-1:1));abreFoto(p.id);desenhaFotos();
    if(!DEMO)api('/rest/v1/rpc/baile_curtir',{method:'POST',headers:JSONH,body:JSON.stringify({p_id:p.id,p_delta:ja?-1:1})}).then(function(n){if(typeof n==='number'){p.likes=n;desenhaFotos();if(!$('det').hidden&&posts[atual]===p)abreFoto(p.id)}}).catch(function(){});return}
  if(e.target.closest('#dpv')&&atual>0){abreFoto(posts[atual-1].id);return}
  if(e.target.closest('#dnx')&&atual<posts.length-1){abreFoto(posts[atual+1].id);return}
  var a=e.target.closest('#dap');if(a){
    if(a.dataset.sure){var dead=p;
      if(DEMO){posts=posts.filter(function(x){return x!==dead});fechaFoto();desenha();aviso('Postagem apagada.');return}
      api('/rest/v1/rpc/baile_apagar_post',{method:'POST',headers:JSONH,body:JSON.stringify({p_id:dead.id,p_senha:SENHA})}).then(function(ok){
        if(ok===true){posts=posts.filter(function(x){return x!==dead});fechaFoto();desenha();aviso('Postagem apagada.')}else{aviso('Senha da aniversariante não confere.');a.removeAttribute('data-sure');a.textContent='apagar'}
      }).catch(function(){aviso('Não consegui apagar. Tente de novo.')});return}
    a.dataset.sure='1';a.textContent='tem certeza? toque de novo'}});
$('feed').addEventListener('click',function(e){
  if(e.target.closest('#bsel')){selMode=true;sel={};desenha();return}
  if(e.target.closest('#bfim')){selMode=false;sel={};desenha();return}
  if(e.target.closest('#btod')){if(Object.keys(sel).length===posts.length)sel={};else posts.forEach(function(p){sel[p.id]=1});desenha();return}
  if(e.target.closest('#bbx')){baixar();return}
  var t=e.target.closest('.post');if(!t)return;var id=t.dataset.id;
  if(anf&&selMode){if(sel[id])delete sel[id];else sel[id]=1;desenha();return}
  abreFoto(id)});
$('mural').addEventListener('click',function(e){
  var d=e.target.closest('.del');if(!d)return;
  if(!d.dataset.sure){d.dataset.sure='1';d.textContent='tem certeza? toque de novo';return}
  var id=d.dataset.rid;
  if(DEMO){recados=recados.filter(function(r){return String(r.id)!==id});desenha();aviso('Recado apagado.');return}
  api('/rest/v1/rpc/baile_apagar_recado',{method:'POST',headers:JSONH,body:JSON.stringify({p_id:id,p_senha:SENHA})}).then(function(ok){
    if(ok===true){recados=recados.filter(function(r){return String(r.id)!==id});desenha();aviso('Recado apagado.')}else aviso('Senha da aniversariante não confere.')}).catch(function(){aviso('Não consegui apagar.')})});
/* baixar fotos selecionadas (aniversariante) */
var CRCT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(u){var c=0xFFFFFFFF;for(var i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(L){var parts=[],cen=[],off=0;
  function u16(v){return [v&255,(v>>8)&255]}function u32(v){return [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255]}
  L.forEach(function(e){var c=crc(e.d);
    var h=new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(c),u32(e.d.length),u32(e.d.length),u16(e.n.length),u16(0)));
    parts.push(h,e.n,e.d);
    cen.push(new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(c),u32(e.d.length),u32(e.d.length),u16(e.n.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off))),e.n);
    off+=h.length+e.n.length+e.d.length});
  var cs=0;cen.forEach(function(p){cs+=p.length});
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(L.length),u16(L.length),u32(cs),u32(off),u16(0)));
  return new Blob(parts.concat(cen,[end]),{type:'application/zip'})}
function salvar(blob,nome){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function bm(t){var e=$('bmsg');if(e)e.textContent=t||''}
function baixar(){bm('preparando…');var enc=new TextEncoder();
  Promise.all(posts.filter(function(p){return sel[p.id]}).map(function(p,i){return fetch(p.url).then(function(r){return r.blob()}).then(function(b){return b.arrayBuffer().then(function(ab){
    var ext=p.video?(b.type.indexOf('webm')>-1?'webm':'mp4'):'jpg';var nm=(p.nome||'convidado').normalize('NFD').replace(/[^\x00-\x7f]/g,'').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
    return {n:enc.encode('album-'+(i+1)+'-'+nm+'.'+ext),d:new Uint8Array(ab),b:b}})})})).then(function(L){
    if(L.length===1){salvar(L[0].b,new TextDecoder().decode(L[0].n));bm('baixada.');return}
    salvar(zip(L),'album-giovanna-15.zip');bm(L.length+' arquivos baixados em um .zip.')}).catch(function(){bm('não consegui preparar. Tente de novo.')})}
/* ---------- enviar ---------- */
function comprime(file){return new Promise(function(ok,no){
  function fim(src,w,h){var k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);c.toBlob(function(b){b?ok(b):no(new Error('imagem'))},'image/jpeg',.86)}
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){fim(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(u)};
  im.onerror=function(){URL.revokeObjectURL(u);if(window.createImageBitmap)createImageBitmap(file).then(function(b){fim(b,b.width,b.height)}).catch(function(){no(new Error('formato'))});else no(new Error('formato'))};
  im.src=u})}
function sobe(blob,ext){var nome='baile/'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  return fetch(SB_URL+'/storage/v1/object/album/'+nome,{method:'POST',headers:H({'Content-Type':blob.type||'application/octet-stream','x-upsert':'false'}),body:blob}).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('envio '+r.status+' '+t.slice(0,120))});
    return SB_URL+'/storage/v1/object/public/album/'+nome})}
var arqP=null,envP=false,envR=false;
function mostraP(f){arqP=f;var v=/^video\//.test(f.type);if(v&&f.size>50*1024*1024){$('pe').textContent='Esse vídeo passa de 50 MB. Escolha um menor.';arqP=null;return}
  $('pe').textContent='';var u=URL.createObjectURL(f);$('ppv').hidden=v;$('pvv').hidden=!v;(v?$('pvv'):$('ppv')).src=u}
$('fab').onclick=function(){$('vp').hidden=false};
$('pc').onclick=function(){$('vp').hidden=true};
$('pcam').onclick=function(){$('icam').click()};$('pgal').onclick=function(){$('igal').click()};
$('icam').onchange=$('igal').onchange=function(){if(this.files[0])mostraP(this.files[0]);this.value=''};
$('fp').addEventListener('submit',function(e){e.preventDefault();if(envP)return;
  if(!arqP){$('pe').textContent='Tire uma foto ou escolha da galeria.';return}
  var nome=$('pn').value.trim(),leg=$('pl').value.trim();if(!nome){$('pe').textContent='Escreva o seu nome.';return}
  var v=/^video\//.test(arqP.type),btn=$('ps');envP=true;btn.disabled=true;btn.textContent='Enviando…';$('pe').textContent='';
  function reset(){arqP=null;$('ppv').hidden=true;$('pvv').hidden=true;$('pl').value='';$('vp').hidden=true;desenha();aviso('Publicado no álbum!')}
  if(DEMO){var u=URL.createObjectURL(arqP);posts.unshift({id:'d'+nid++,nome:nome,leg:leg,likes:0,video:v,url:u});reset();envP=false;btn.disabled=false;btn.textContent='Publicar';return}
  (v?Promise.resolve({b:arqP,ext:/webm/.test(arqP.type)?'webm':/quicktime/.test(arqP.type)?'mov':'mp4'}):comprime(arqP).then(function(b){return {b:b,ext:'jpg'}}))
   .then(function(o){return sobe(o.b,o.ext)}).then(function(u){
    return api('/rest/v1/baile_posts',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({nome:nome,legenda:leg||null,tipo:v?'video':'foto',url:u})})}).then(function(r){
    if(r&&r[0])posts.unshift(daPost(r[0]));reset()
  }).catch(function(er){$('pe').textContent='Não consegui publicar agora. Confira a internet e tente de novo. ('+String(er.message||er).slice(0,80)+')'}).then(function(){envP=false;btn.disabled=false;btn.textContent='Publicar'})});
$('fab2').onclick=function(){$('vr').hidden=false};
$('rc').onclick=function(){$('vr').hidden=true};
$('fr').addEventListener('submit',function(e){e.preventDefault();if(envR)return;
  var nome=$('rn').value.trim(),txt=$('rt').value.trim();
  if(!nome){$('re').textContent='Escreva o seu nome.';return}if(!txt){$('re').textContent='Escreva o seu recado.';return}
  var btn=$('rs');envR=true;btn.disabled=true;btn.textContent='Enviando…';$('re').textContent='';
  function reset(){$('rt').value='';$('vr').hidden=true;desenha();aviso('Recado enviado!')}
  function fim(){envR=false;btn.disabled=false;btn.textContent='Enviar recado'}
  if(DEMO){recados.unshift({id:'d'+nid++,nome:nome,texto:txt,foto:null,quando:new Date().toISOString()});reset();fim();return}
  Promise.resolve(null).then(function(u){
    return api('/rest/v1/baile_recados',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({nome:nome,texto:txt,foto_url:u})})}).then(function(r){
    if(r&&r[0])recados.unshift(daRec(r[0]));reset()}).catch(function(er){$('re').textContent='Não consegui enviar agora. Confira a internet e tente de novo. ('+String(er.message||er).slice(0,80)+')'}).then(fim)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){fechaFoto();$('vp').hidden=true;$('vr').hidden=true}});
['vp','vr'].forEach(function(i){$(i).addEventListener('click',function(e){if(e.target===$(i))$(i).hidden=true})});
/* ---------- carregar ---------- */
function sig(L){return L.map(function(p){return p.id+':'+(p.likes||'')}).join('|')}
function carrega(primeira){
  if(DEMO)return;
  var parado=$('det').hidden&&$('vp').hidden&&$('vr').hidden&&!selMode;
  Promise.all([api('/rest/v1/baile_posts?select=*&order=criado_em.desc&limit=300'),api('/rest/v1/baile_recados?select=*&order=criado_em.desc&limit=300')]).then(function(x){
    var np=x[0].map(daPost),nr=x[1].map(daRec);falhou=false;
    if(primeira||(parado&&(sig(np)!==sig(posts)||sig(nr)!==sig(recados)))){posts=np;recados=nr;carregando=false;desenha()}
    carregando=false;
  }).catch(function(){carregando=false;if(primeira){falhou=true;desenha()}})}
if(DEMO){recados=[{id:'a',nome:'Tia Ana',texto:'Que a sua noite seja mágica, dourada e inesquecível.',foto:null,quando:new Date(Date.now()-7200000).toISOString()},{id:'b',nome:'Bia',texto:'Linda como sempre! Te amo demais.',foto:null,quando:new Date(Date.now()-86400000).toISOString()}]}
troca('f');window.scrollTo(0,0);desenha();carrega(true);
setInterval(function(){if(!document.hidden)carrega(false)},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)carrega(false)});
</script>
